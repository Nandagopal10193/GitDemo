<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TravelEase - Itinerary</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- NAVIGATION -->

    <nav class="navbar">

        <div class="logo">
            ✈️ TravelEase
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="services.html">
                    Services
                </a>
            </li>

            <li>
                <a
                    href="itinerary.html"
                    class="active"
                >
                    Itinerary
                </a>
            </li>

            <li>
                <a href="alerts.html">
                    Alerts
                </a>
            </li>

            <li>
                <a href="modules.html">
                    Modules
                </a>
            </li>

            <li>
                <button
                    class="login-btn"
                    onclick="openLogin()"
                >
                    Login
                </button>
            </li>

        </ul>

    </nav>


    <!-- PAGE HEADER -->

    <section class="page-header">

        <h1>
            🗺️ Complete Trip Planner
        </h1>

        <p>
            Plan your complete journey from morning
            to night.
        </p>

    </section>


    <!-- TRIP FORM -->

    <section class="section">

        <div class="form-card">

            <h2>
                Plan Your Trip
            </h2>

            <p>
                Enter your destination and trip duration.
            </p>


            <label>
                Destination
            </label>

            <input
                type="text"
                id="destination"
                placeholder="Example: Hyderabad"
            >


            <label>
                Starting Location
            </label>

            <input
                type="text"
                id="startLocation"
                placeholder="Example: Vijayawada"
            >


            <label>
                Number of Days
            </label>

            <input
                type="number"
                id="duration"
                placeholder="Example: 3"
                min="1"
                max="14"
            >


            <label>
                Number of Travellers
            </label>

            <input
                type="number"
                id="travellers"
                placeholder="Example: 2"
                min="1"
                value="1"
            >


            <button
                class="btn"
                onclick="generateItinerary()"
            >
                🗺️ Generate Complete Trip
            </button>

        </div>


        <!-- TRIP RESULT -->

        <div
            id="itineraryResult"
            class="itinerary-result"
        >
        </div>

    </section>


    <!-- LOGIN POPUP -->

    <div
        id="loginModal"
        class="login-modal"
    >

        <div class="login-box">

            <button
                class="close-btn"
                onclick="closeLogin()"
            >
                ×
            </button>

            <h2>
                TravelEase Login
            </h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button
                class="btn"
                onclick="loginUser()"
            >
                Login
            </button>

        </div>

    </div>


    <footer>

        <p>
            © 2026 TravelEase
        </p>

    </footer>


    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    

</body>

</html>
